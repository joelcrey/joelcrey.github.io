<html>
	<head>
		<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
		<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}" />
		<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
		{% if page.sagecell %}{% include sagecell.html %}{% endif %}
	</head>
	<body class="is-preload">

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Main -->
					<div id="main">
						<div class="inner">

							{% include header.html %}

							{{ content }}

							{% include footer.html %}

						</div>
					</div>

			</div>

		<!-- Scripts -->
			<script src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/browser.min.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/breakpoints.min.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/util.js' | relative_url }}"></script>
			<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
			<script>
				// Collapsible sections (_plugins/collapsible_sections.rb): open the section a link points to,
				// and redraw Sage cells that were set up while their section was closed.
				(function () {
					function openTarget() {
						var el = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
						for (; el; el = el.parentElement) if (el.tagName === 'DETAILS') el.open = true;
					}
					window.addEventListener('hashchange', openTarget);
					openTarget();
					document.querySelectorAll('details.md-section').forEach(function (d) {
						d.addEventListener('toggle', function () {
							if (d.open) d.querySelectorAll('.CodeMirror').forEach(function (cm) { if (cm.CodeMirror) cm.CodeMirror.refresh(); });
						});
					});
				})();
			</script>

	</body>
</html>

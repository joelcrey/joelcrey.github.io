# Simple (ADE) singularities and their adjacencies, by characteristic. Read by _includes/ade-map.html.
# Generated from the notes "Explicit adjacencies of simple singularities in positive characteristic";
# edit by hand or regenerate. Math is written as in Obsidian ($...$); nf, f and where are TeX without dollars.
# Characteristic "0" also covers every p > 5; "2" is p = 2 in odd dimension (curves), "2e" in even dimension
# (surfaces). For p != 2, add a nondegenerate quadratic form Q in further variables; for p = 2 see the notes.
#
# nodes: id (A6^2 means A_6^2), family, n, r (superscript or null), forms: per characteristics, normal
#        form nf, Milnor number mu (of this normal form; null: infinite) and Tjurina number tau. In each
#        characteristic the class with the largest superscript is drawn where the classical one is.
# edges: `from` deforms into `to`; implied: characteristics where the arrow is a composition of others
#        (drawn only on request); unfoldings: a family F_s with F_0 = from and F_s of type `to` for s != 0
#        (for generic s when generic: true), with optional where, proof, note, source and a Singular check.

chars:
  - key: "0"
    label: "0 or p > 5"
    equiv: contact
    nf_ref: '[Ar]'
    note: 'The classical diagram [Ar].'
  - key: "5"
    label: "p = 5"
    equiv: contact
    nf_ref: '[GK, 1.2], [Art, §3]'
    note: '$E_8$ splits into $E_8^0$ and $E_8^1$ [GK, 1.2], [Art, §3].'
  - key: "3"
    label: "p = 3"
    equiv: contact
    nf_ref: '[GK, 1.2], [Art, §3]'
    note: '$E_6$, $E_7$ split in two and $E_8$ in three [GK, 1.2], [Art, §3].'
  - key: "2"
    label: "p = 2, odd dim."
    equiv: contact
    nf_ref: '[GK, 1.2], [Kr]'
    note: 'Plane curves; in $n = 2k$ variables add $x_3x_4 + \dots + x_{n-1}x_n$ [GK, 1.2], [Kr].'
  - key: "2e"
    label: "p = 2, even dim."
    equiv: contact
    nf_ref: '[Art, §3], [GK, 1.2], [Kr]'
    note: 'Surfaces, Artin''s normal forms [Art, §3], [GK, 1.2], [Kr]; in $n = 2k+1$ variables add $x_4x_5 + \dots + x_{n-1}x_n$ [GK, 1.2].'
  - key: "R0"
    label: "0"
    equiv: right
    nf_ref: '[Ar]'
    note: 'Same classes as for contact equivalence [Ar], [GN, §3].'
  - key: "R11"
    label: "p ≥ 11"
    equiv: right
    ends: { A: "A_{p-2}", D: "D_{p-1}" }
    nf_ref: '[GN, Table 3.2(i)]'
    note: 'Right simple: $A_k$ ($k \leq p - 2$), $D_k$ ($k \leq p - 1$), $E_6$, $E_7$, $E_8$ [GN, Thm. 3.2].'
  - key: "R7"
    label: "p = 7"
    equiv: right
    nf_ref: '[GN, Table 3.2(i)]'
    note: 'Right simple: $A_k$ ($k \leq 5$), $D_k$ ($k \leq 6$), $E_6$ [GN, Thm. 3.2]. $E_7$, $E_8$, listed in [GN, Table 3.2(i)], are left out by [GN, Prop. 2.7 and 3.6]. *Disclaimer: this departs from [GN] and is our own reading; it has not been confirmed by the authors.*'
  - key: "R5"
    label: "p = 5"
    equiv: right
    nf_ref: '[GN, Table 3.2(i)]'
    note: 'Right simple: $A_1$, $A_2$, $A_3$, $D_4$ [GN, Thm. 3.2]. $E_6$, $E_7$, listed in [GN, Table 3.2(i)], are left out by [GN, Prop. 2.7 and 3.6]. *Disclaimer: this departs from [GN] and is our own reading; it has not been confirmed by the authors.*'
  - key: "R3"
    label: "p = 3"
    equiv: right
    nf_ref: '[GN, Table 3.2(i)]'
    note: 'Only $A_1$ is right simple [GN, Thm. 3.2].'
  - key: "R2"
    label: "p = 2, odd dim."
    equiv: right
    nf_ref: '[GN, Thm. 3.3]'
    note: 'Only $A_1 = x_1x_2 + \dots + x_{n-1}x_n$ is right simple [GN, Thm. 3.3].'
  - key: "R2e"
    label: "p = 2, even dim."
    equiv: right
    nf_ref: '[GN, Thm. 3.3]'
    note: 'No right simple singularities [GN, Thm. 3.3].'


name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The CV page data is regenerated from cv/cv.xlsx. The CV PDF is not compiled here: the committed
      # acadcv.pdf is used, made locally with `python3 cv/build_cv.py --pdf`. If the spreadsheet changed
      # what goes in the PDF without that, cv/sections.tex comes out different and the deploy stops.
      - run: python3 cv/build_cv.py
      - name: Check that acadcv.pdf is up to date
        run: |
          git diff --quiet -- cv/sections.tex || {
            echo "::error::The CV PDF is out of date with cv/cv.xlsx. Run 'python3 cv/build_cv.py --pdf' and commit acadcv.pdf."
            exit 1
          }
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5
      # The Han–Monsky notes stay off the site until their posts are published (delete this step then).
      # Locally they are still served, so the Sage cells in the drafts keep working.
      - run: rm -rf notes/han-monsky
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
